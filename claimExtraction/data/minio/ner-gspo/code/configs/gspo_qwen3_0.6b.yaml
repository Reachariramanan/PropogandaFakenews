# GSPO IE config — Qwen3-0.6B + VERL + MLflow

model:
  name: Qwen/Qwen3-0.6B
  # set to SFT checkpoint path after cold-start, e.g. outputs/sft_qwen3_0.6b_ie/final

data:
  source_jsonl: ../NER_TOPIC_Modelling/data/ner_topic_llm_dataset.jsonl
  processed_dir: data/grpo
  max_source_chars: 6000
  max_target_chars: 8000
  train_ratio: 0.90
  val_ratio: 0.05
  seed: 42

# GSPO paper clips (NOT GRPO 0.2)
gspo:
  clip_ratio_low: 3.0e-4
  clip_ratio_high: 4.0e-4
  rollout_n: 4              # group size G
  adv_estimator: grpo       # group-relative advantages
  policy_loss_mode: gspo
  loss_agg_mode: seq-mean-token-mean
  use_kl_loss: false
  actor_lr: 1.0e-6

train:
  output_dir: outputs/gspo_qwen3_0.6b_ie
  n_gpus: 1
  nnodes: 1
  train_batch_size: 32
  ppo_mini_batch_size: 16
  max_prompt_length: 1536
  max_response_length: 2048  # gold IE JSON runs long (~1.3-1.7k tok avg); 1024 truncated most targets
  total_epochs: 2
  save_freq: 20
  test_freq: 10
  rollout_gpu_mem_util: 0.45
  tensor_model_parallel_size: 1
  rollout_name: vllm        # fallback handled in shell if vllm missing
  attn_implementation: sdpa # flash_attn not installed; flip to flash_attention_2 if it ever is

sft:
  output_dir: outputs/sft_qwen3_0.6b_ie
  num_epochs: 1
  per_device_batch_size: 2
  grad_accum: 8
  lr: 2.0e-5
  max_seq_length: 3072
  max_samples: null

mlflow:
  enabled: true
  tracking_uri: http://<INTERNAL_IP>:5000
  # VERL uses project_name as MLflow experiment
  experiment_name: gspo-ie-qwen3-0.6b
  # VERL run name
  run_name_prefix: gspo_qwen3_0.6b
